description: >-
  Tohoku University is a Japanese national research university in Sendai, founded in 1907, one of
  the seven former Imperial Universities and a Designated National University. Its programmable
  footprint is small, unevenly distributed, and mostly NOT operated by central IT — which is the
  honest shape for a university, and the profile says so rather than padding it. Exactly one
  unambiguously institution-operated API was found: jMorp, the Japanese Multi Omics Reference
  Panel published by the Tohoku Medical Megabank Organization at jmorp.megabank.tohoku.ac.jp,
  which answers anonymous GraphQL queries and full schema introspection over a 305-field read-only
  query root. Everything else is a relationship rather than a contract: the TOUR institutional
  repository is a tenant on NII's JAIRO Cloud (WEKO3) with a live OAI-PMH 2.0 endpoint; the
  university operates its own SAML 2.0 Shibboleth Identity Provider registered in the GakuNin
  national academic federation; and three of its units are Crossref DOI-registering members. There
  is no central developer portal, no API key issuance, no open-data platform, no llms.txt, no MCP
  server and no published OpenAPI anywhere on tohoku.ac.jp. Public course information is served as
  HTML by the university's own QuickSyllabus, not as an API.
