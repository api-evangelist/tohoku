apis:
  - aid: tohoku:jmorp-graphql
    name: jMorp GraphQL API (Tohoku Medical Megabank Organization)
    x-operator: institution
    description: >-
      Public, anonymous, read-only GraphQL API for jMorp — the Japanese Multi Omics Reference Panel
      published by the Tohoku Medical Megabank Organization (ToMMo), an institute of Tohoku
      University. Runs on the university's own registrable domain, so the contract is genuinely
      Tohoku's engineering rather than a vendor's product wearing the university's name. Verified
      live on 2026-09-01: full __schema introspection returns 6.7 MB of JSON describing 4,470
      types; query_root exposes 305 fields covering variants (clinvar, dbnsfp, dbsnp, GATK CNV,
      ExpansionHunter), GENCODE gene models and cross-references (Entrez, UniProt, RefSeq, PDB,
      HGNC), and dataset catalog entries with a dtaRequired flag for controlled-access data. There
      is a subscription root but no mutation root. No authentication, no API key, no rate-limit
      headers, no published OpenAPI and no vendor documentation of the interface.
    humanURL: https://jmorp.megabank.tohoku.ac.jp/
    baseURL: https://jmorp.megabank.tohoku.ac.jp/api/graphql
