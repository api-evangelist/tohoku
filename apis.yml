x-coverage:
  state: covered
  reason: covered
  detail: >-
    The full public surface was reached with no wall. One genuinely institution-operated API was
    found and exercised anonymously end to end — the jMorp GraphQL endpoint at
    jmorp.megabank.tohoku.ac.jp, including a complete 6.7 MB schema introspection and two live
    domain queries that returned real data. The TOUR OAI-PMH endpoint answered Identify,
    ListMetadataFormats and ListSets. Tohoku's Shibboleth IdP was confirmed inside the 5.65 MB
    GakuNin aggregate metadata, and three Crossref memberships and the ROR record were confirmed
    against their registries' APIs. The absences are real, not blocked: tohoku.ac.jp serves no
    llms.txt, no /.well-known/security.txt, no OpenAPI, no MCP server, no agent card and no
    developer portal; DataCite returns zero providers matching Tohoku; the UNIPA guest syllabus
    entry point was in scheduled maintenance (HTTP 503) while QuickSyllabus, the university's own
    public course catalog, served normally as HTML with no JSON interface behind it. Japanese-
    language surfaces were searched as well as English ones, which is how the generative-AI
    guidance and the QuickSyllabus entry point were found.
