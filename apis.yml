    name: GakuNin Shibboleth Identity Provider
    x-operator: federation
    description: >-
      Tohoku University's own SAML 2.0 Identity Provider, registered in GakuNin — the Japanese
      academic access-management federation operated by NII. entityID
      https://idp.auth.tohoku.ac.jp/idp/shibboleth, OrganizationName "Tohoku University / 東北大学",
      shibmd:Scope auth.tohoku.ac.jp, HTTP-Redirect binding for SingleSignOn and SingleLogout.
      Confirmed in the GakuNin aggregate metadata on 2026-09-01. A federation is shared by
      definition, but the IdP behind it is the institution's — this is one of the strongest
      institution-operated machine-readable surfaces the university has. The SSO endpoint is
      hosted for Tohoku by SECIOSS (slink.secioss.com), so the entity is theirs and the operation
