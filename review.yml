  - date: '2026-09-01'
    rating: 3
    summary: >-
      University-pipeline re-profile with the operator axis applied before anything was saved.
      The 2026-06-03 pass recorded a single surface — the TOUR OAI-PMH endpoint — and concluded
      the university had no API. That conclusion was wrong in one important place and right
      everywhere else. jMorp, the Japanese Multi Omics Reference Panel published by the Tohoku
      Medical Megabank Organization on the university's own domain, exposes a public,
      unauthenticated GraphQL API with introspection enabled: 4,470 types, a 305-field read-only
      query root, a subscription root, no mutation root. It was exercised anonymously end to end
      and is the one surface on this profile that is genuinely Tohoku University's engineering.
      Two further institution-side relationships were found that a host-only reading misses: the
      university's own SAML 2.0 Shibboleth Identity Provider registered in GakuNin
      (entityID https://idp.auth.tohoku.ac.jp/idp/shibboleth, scope auth.tohoku.ac.jp), and three
      Crossref DOI-registering memberships held by university units. TOUR was re-labelled
      x-operator tenant — the collection and the admin contact are Tohoku's, the OAI-PMH
      implementation is NII's, and NII's contract is deliberately not saved here. Nothing was
      deleted to reach this shape. Absences confirmed and recorded rather than papered over: no
      developer portal, no OpenAPI, no llms.txt, no security.txt, no MCP server, no open-data
      portal (data./opendata./api.tohoku.ac.jp all NXDOMAIN), zero DataCite providers, no
      evidenced ORCID institutional membership. Japanese-language surfaces were searched as well
      as English, which is how the generative-AI guidance and the public QuickSyllabus course
      catalog were found.
    endpoints:
