description: >-
  Tohoku University sells nothing programmable and publishes no pricing, no plan tiers and no
  terms of use for any API. The two surfaces a member of the public can call are free and
  anonymous: the jMorp GraphQL endpoint (institution-operated, no key, no registration) and the
  TOUR OAI-PMH endpoint (tenant on NII JAIRO Cloud, open by protocol). The gated tier is not a
  paid one — controlled-access jMorp datasets are flagged Dataset.dtaRequired and released through
  a Data Transfer Agreement, which is paperwork rather than a plan, and the university's SAML IdP
  gates services by institutional affiliation rather than payment.
notes: >-
  There is no commercial plan to describe. "Free / Open" below is the observed state of the two
  anonymous endpoints, not an offer the university publishes.
